<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Amarílis Tech School</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <div class="container">
        <div class="lado-esquerdo">
            <div class="texto-logo">
                <p>Educação que floresce com tecnologia.</p>
            </div>
        </div>
        <div class="lado-direito">
            <div class="login-box">
                <h2>Login</h2>
                <input type="email" id="email" placeholder="E-mail (ex: thayla@amarilis.edu.com)">
                <input type="password" id="senha" placeholder="Senha">
                <button class="btn-principal" id="btn-entrar" type="button" onclick="login()">Entrar</button>
                <p id="erro" style="color: red; margin-top: 1rem; font-size: 0.9rem;"></p>
            </div>
        </div>
    </div>
    <script src="./assets/script.js"></script>
</body>

</html>
