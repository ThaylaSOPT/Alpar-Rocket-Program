<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Automação de Luzes</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <a href="../index.html" class="btn-voltar" title="Voltar para o Portfólio">Voltar ao portfólio</a>

    <h1>💡 Automação de Luzes</h1>

    <div class="casa">

        <div class="janela" id="quarto">Quarto</div>
        <div class="janela" id="sala">Sala</div>

    </div>

    <div class="botoes">
        <button data-comodo="quarto" data-acao="ligar">Ligar Quarto</button>
        <button data-comodo="quarto" data-acao="desligar">Desligar Quarto</button>

        <button data-comodo="sala" data-acao="ligar">Ligar Sala</button>
        <button data-comodo="sala" data-acao="desligar">Desligar Sala</button>
    </div>

    <p id="status"></p>

    <script src="./assets/script.js"></script>
</body>

</html>
